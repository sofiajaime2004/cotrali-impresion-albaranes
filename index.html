  if (n < 0) n = (r === 0) ? 1 : 0;

  var vp = page.getViewport({ scale: 1800 / Math.max(b.width, b.height) });
  var cv = document.createElement('canvas'); cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
  var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: cx, viewport: vp }).promise;
  var data = cv.toDataURL('image/jpeg', 0.85).split(',')[1];
  for (var attempt = 0; attempt < 2; attempt++) {
    try {
      var r = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Access-Code': S.code }, body: JSON.stringify({ image: data }) });

      if (attempt === 1) throw e;

/* ---------- hueco libre en cada hoja ---------- */
async function getInk(pdf, pageNo) {

  if (inkCache.has(key)) return inkCache.get(key);
  var page = await pdf.doc.getPage(pageNo);
  var vp1 = page.getViewport({ scale: 1 }), sc = 0.5, vps = page.getViewport({ scale: sc });
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(vps.width); cv.height = Math.ceil(vps.height);

  await page.render({ canvasContext: ctx, viewport: vps }).promise;

  var hist = new Uint32Array(256), q;
  for (q = 0; q < d.length; q += 4) hist[(d[q] * 3 + d[q + 1] * 6 + d[q + 2]) / 10 | 0]++;

  for (q = 0; q < 256; q++) { acc += hist[q]; if (acc >= tot * 0.6) { med = q; break; } }
  var thr = Math.min(235, Math.max(150, med - 40));

  for (var y = 0; y < h; y++) {
    var row = 0;
    for (var xx = 0; xx < w; xx++) {
      var o = (y * w + xx) * 4;
      if ((d[o] * 3 + d[o + 1] * 6 + d[o + 2]) / 10 < thr) row++;

    }
  }
  var g = { W: vp1.width, H: vp1.height, w: w, h: h, sc: sc, I: I, T: vp1.transform };
  inkCache.set(key, g);
  return g;
}
function rectInk(g, x, y, bw, bh) {
  var x0 = Math.max(0, Math.floor(x * g.sc)), y0 = Math.max(0, Math.floor(y * g.sc));
  var x1 = Math.min(g.w, Math.ceil((x + bw) * g.sc)), y1 = Math.min(g.h, Math.ceil((y + bh) * g.sc));

  var s = g.w + 1, I = g.I;
  var n = I[y1 * s + x1] - I[y0 * s + x1] - I[y1 * s + x0] + I[y0 * s + x0];

}
function findSpot(g, bw, bh, pos) {

  var k, f;
  for (var i = 0; i < order.length; i++) {

      var dd = Math.hypot(x - a[0], y - a[1]);

      if (!bestInk || f < bestInk.ink - 1e-9) bestInk = { x: x, y: y, ink: f, tight: true };

}

/* ---------- estampar el código en el PDF ---------- */
function mul(m1, m2) {
  return [m1[0] * m2[0] + m1[2] * m2[1], m1[1] * m2[0] + m1[3] * m2[1], m1[0] * m2[2] + m1[2] * m2[3], m1[1] * m2[2] + m1[3] * m2[3],
    m1[0] * m2[4] + m1[2] * m2[5] + m1[4], m1[1] * m2[4] + m1[3] * m2[5] + m1[5]];

    var spot = findSpot(g, geo.boxW, geo.boxH, S.pos);
    if (spot.tight) tight++;

    var T = g.T, det = T[0] * T[3] - T[1] * T[2];

      var wd = geo.w[i] * geo.mw;
      if (i % 2 === 0) pg.drawRectangle({ x: x, y: yb, width: wd, height: BH, color: L.rgb(0, 0, 0) });
      x += wd;
    }
    var tw = font.widthOfTextAtSize(tg.num, FS);
    pg.drawText(tg.num, { x: bx + (geo.boxW - tw) / 2, y: by + 3, size: FS, font: font, color: L.rgb(0, 0, 0) });

/* ---------- comprobación final: se vuelve a leer cada código estampado ---------- */

    var cv = document.createElement('canvas'); cv.width = Math.ceil(w * K); cv.height = Math.ceil(h * K);

    await page.render({ canvasContext: cx, viewport: page.getViewport({ scale: K }), transform: [1, 0, 0, 1, -x0 * K, -y0 * K] }).promise;

  var cv = $('#pv'); if (!cv) return;
  var it = S.items[S.sel] || S.items[0]; if (!it || it.pdfIdx == null) return;
  var token = ++pvToken, pdf = S.pdfs[it.pdfIdx], pi = Math.min(S.page, it.n - 1), pageNo = it.from + pi + 1;
  try {
    var page = await pdf.doc.getPage(pageNo), base = page.getViewport({ scale: 1 });
    var cssW = Math.min(300, cv.parentElement.clientWidth || 300), dpr = window.devicePixelRatio || 1, k = cssW / base.width * dpr;
    var vp = page.getViewport({ scale: k });
    var off = document.createElement('canvas'); off.width = Math.ceil(vp.width); off.height = Math.ceil(vp.height);
    var oc = off.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, off.width, off.height);
    await page.render({ canvasContext: oc, viewport: vp }).promise;
    var note = null;
    if (it.kind === 'ok') {
      var g = await getInk(pdf, pageNo), geo = geom(it.num, g.W), sp = findSpot(g, geo.boxW, geo.boxH, S.pos), s = k;
      oc.fillStyle = '#fff'; oc.fillRect(sp.x * s, sp.y * s, geo.boxW * s, geo.boxH * s);
      var x = sp.x + (geo.boxW - geo.barsW) / 2, yb = sp.y + 4;
      oc.fillStyle = '#000';
      geo.w.forEach(function (w, i) { var wd = w * geo.mw; if (i % 2 === 0) oc.fillRect(x * s, yb * s, wd * s, BH * s); x += wd; });
      oc.font = '600 ' + (FS * s) + 'px Helvetica, Arial, sans-serif'; oc.textAlign = 'center'; oc.textBaseline = 'alphabetic';
      oc.fillText(it.num, (sp.x + geo.boxW / 2) * s, (sp.y + 4 + BH + 3 + FS) * s);
      oc.strokeStyle = '#0069a6'; oc.setLineDash([6 * dpr, 4 * dpr]); oc.lineWidth = 2 * dpr; oc.strokeRect((sp.x - 3) * s, (sp.y - 3) * s, (geo.boxW + 6) * s, (geo.boxH + 6) * s);
      if (sp.tight) note = 'En esta hoja no hay un hueco totalmente libre: el código irá donde menos contenido tapa. Prueba otra esquina.';
    }
    if (token !== pvToken) return;
    cv.width = off.width; cv.height = off.height; cv.style.width = cssW + 'px'; cv.style.height = (base.height / base.width * cssW) + 'px';
    cv.getContext('2d').drawImage(off, 0, 0);
    if (note) { var n = $('#pvnote'); if (n) { n.textContent = note; n.className = 'bad-t'; n.style.fontWeight = '600'; } }
  } catch (e) { /* vista previa no disponible */ }
}

/* ---------- eventos ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var a = b.dataset.act, arg = b.dataset.arg;
  if (a === 'pick') { $('#fpick').value = ''; $('#fpick').click(); }
  else if (a === 'rmpdf') { S.pdfs.splice(+arg, 1); S.err = ''; render(); }
  else if (a === 'clrpdf') { S.pdfs = []; S.err = ''; render(); }
  else if (a === 'clrxls') { S.xls = null; S.err = ''; render(); }
  else if (a === 'to2') { goReview(); }
  else if (a === 'to1') { S.step = 1; render(); window.scrollTo(0, 0); }
  else if (a === 'filter') { S.filter = arg; render(); }
  else if (a === 'sel') { S.sel = +arg; S.page = 0; render(); }
  else if (a === 'prev') { S.page = Math.max(0, S.page - 1); render(); }
  else if (a === 'next') { S.page += 1; render(); }
  else if (a === 'pos') { S.pos = arg; render(); }
  else if (a === 'gen') { generate(); }
  else if (a === 'dl') { downloadOne(+arg); }
  else if (a === 'zip') { downloadZip(); }
  else if (a === 'report') { downloadReport(); }
  else if (a === 'restart') { S.step = 1; S.pdfs = []; S.xls = null; S.items = []; S.outputs = []; S.msg = ''; S.err = ''; inkCache.clear(); render(); window.scrollTo(0, 0); }
});
document.addEventListener('change', async function (e) {
  var t = e.target;
  if (t.id === 'fpick') { handleFiles(t.files); return; }
  var a = t.dataset && t.dataset.change; if (!a || !S.xls) return;
  if (a === 'assign') {
    var id = t.dataset.arg; S.manual[id] = t.value || null;
    await analyze();
    var ni = S.items.findIndex(function (i) { return i.id === id; });
    S.sel = ni >= 0 ? ni : 0; render(); return;
  }
  if (a === 'hdr') { S.xls.header = t.checked; guessCols(S.xls); }
  else if (a === 'colref') S.xls.colRef = +t.value;
  else if (a === 'colnum') S.xls.colNum = +t.value;
  render();
});
document.addEventListener('input', function (e) {
  var t = e.target; if (t.dataset && t.dataset.input === 'code') {
    S.code = t.value;
    var btn = $('[data-act=to2]'); if (btn) { var can = S.pdfs.length && S.xls && S.xls.colRef !== S.xls.colNum && !!S.code; btn.disabled = !can; }
  }
});
['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); var d = e.target.closest && e.target.closest('[data-drop]'); document.querySelectorAll('.drop.over').forEach(function (x) { x.classList.remove('over'); }); if (d) d.classList.add('over'); } }); });
document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', function (e) {
  if (!(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)) return;
  e.preventDefault(); document.querySelectorAll('.drop.over').forEach(function (x) { x.classList.remove('over'); });
  if (S.step === 1) handleFiles(e.dataTransfer.files);
});

/* ---------- arranque ---------- */
function boot() {
  if (!window.pdfjsLib || !window.PDFLib || !window.XLSX || !window.JSZip) {
    $('#app').innerHTML = '<main style="max-width:700px;margin:60px auto;padding:0 24px"><div class="err" role="alert"><p style="margin:0 0 6px;font-weight:700" class="bad-t">No se han podido cargar los componentes de la aplicación</p><p style="margin:0">Comprueba la conexión a internet y recarga la página.</p></div></main>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  render();
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { downloadsCap = d || null; }).catch(function () {}); } catch (e) {}
  window.__cotrali = { S: S, handleFiles: handleFiles, generate: generate };
}
window.addEventListener('load', boot);
})();
</script>
