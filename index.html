<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Myriad Pro","Source Sans 3",system-ui,sans-serif;color:#14202b;background:#f3f6f9;line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
button,select,input{font-family:inherit;font-size:16px}
button{cursor:pointer}
.btn{min-height:44px;padding:0 22px;border-radius:6px;font-weight:600;border:2px solid #0069a6;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:#0069a6;color:#fff}
.btn-primary:hover{background:#00588b;border-color:#00588b}
.btn-secondary{background:#fff;color:#0069a6}
.btn-secondary:hover{background:#e8f1f8}
.btn:disabled{background:#e6ebf0;border-color:#e6ebf0;color:#566370;cursor:not-allowed}
:focus-visible{outline:3px solid #14202b;outline-offset:2px}
.drop{width:100%;min-height:150px;border:2px dashed #7f93a5;border-radius:8px;background:#f8fafc;color:#14202b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center}
.drop:hover,.drop.over{border-color:#0069a6;background:#e8f1f8}
.seg{min-height:44px;padding:0 16px;border:2px solid #0069a6;background:#fff;color:#0069a6;font-weight:600}
.seg[aria-pressed="true"]{background:#0069a6;color:#fff}
.link-btn{min-height:44px;border:0;background:none;color:#0069a6;font-weight:600;text-decoration:underline;padding:0 8px}
.rowbtn{min-height:44px;border:0;background:none;text-align:left;font-weight:600;color:#14202b;padding:0 4px;text-decoration:underline;text-decoration-color:#b6c4d1;text-underline-offset:3px}
.rowbtn:hover{color:#0069a6}
td,th{padding:6px 14px;text-align:left;border-bottom:1px solid #e3e9ef}
th{font-size:14px;color:#3b4957;font-weight:600;background:#f8fafc}
table{border-collapse:collapse;width:100%}
.card{background:#fff;border:1px solid #d5dde5;border-radius:10px}
.sr{position:absolute;left:-9999px}
select{min-height:44px;border:2px solid #7f93a5;border-radius:6px;padding:0 10px;background:#fff;color:#14202b;max-width:100%}
label.chk{display:inline-flex;align-items:center;gap:10px;min-height:44px}
input[type=checkbox]{width:22px;height:22px}
.err{border:2px solid #e20019;border-radius:8px;padding:16px;background:#fff7f7}
.ok-t{color:#14532d}.bad-t{color:#9b0014}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(20,32,43,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay>div{background:#fff;border-radius:10px;padding:28px 32px;max-width:420px;width:100%;text-align:center}
.bar{height:10px;background:#e3e9ef;border-radius:999px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:#0069a6;transition:width .15s}
@media (max-width:640px){.hide-sm{display:none}}
</style>

}
function step3() {

}

document.addEventListener('change', async function (e) {
  var t = e.target;
  if (t.id === 'fpick') { handleFiles(t.files); return; }
  var a = t.dataset && t.dataset.change; if (!a || !S.xls) return;
  if (a === 'assign') {
    var id = t.dataset.arg; S.manual[id] = t.value || null;
    await analyze();
    var ni = S.items.findIndex(function (i) { return i.id === id; });
    S.sel = ni >= 0 ? ni : 0; render(); return;
  }
  if (a === 'hdr') { S.xls.header = t.checked; guessCols(S.xls); }
  else if (a === 'colref') S.xls.colRef = +t.value;
  else if (a === 'colnum') S.xls.colNum = +t.value;
  render();
});
document.addEventListener('input', function (e) {
  var t = e.target; if (t.dataset && (t.dataset.input === 'code' || t.dataset.input === 'cc')) {
    if (t.dataset.input === 'code') S.code = t.value; else S.cc = t.value;
    var btn = $('[data-act=to2]'); if (btn) { var can = S.pdfs.length && S.xls && S.xls.colRef !== S.xls.colNum && !!cleanCc(S.cc) && (!apiUrl() || !!S.code); btn.disabled = !can; }
    var st = $('p[role=status]'); if (st && S.step === 1) { var ms = []; if (!S.pdfs.length) ms.push('los PDF de albaranes'); if (!S.xls) ms.push('el Excel'); if (!cleanCc(S.cc)) ms.push('el código de cliente'); if (apiUrl() && !S.code) ms.push('el código de acceso'); st.textContent = ms.length ? 'Para continuar falta: ' + ms.join(', ') + '.' : 'Todo listo para continuar.'; }
    if (t.dataset.input === 'cc') { var sp = t.closest('.card') && t.closest('.card').querySelector('span.ok-t, span.bad-t'); if (sp) { var okc = !!cleanCc(S.cc); sp.className = okc ? 'ok-t' : 'bad-t'; sp.textContent = okc ? 'Listo' : 'Obligatorio'; } }
  }
});
['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); var d = e.target.closest && e.target.closest('[data-drop]'); document.querySelectorAll('.drop.over').forEach(function (x) { x.classList.remove('over'); }); if (d) d.classList.add('over'); } }); });
document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', function (e) {
  if (!(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)) return;
  e.preventDefault(); document.querySelectorAll('.drop.over').forEach(function (x) { x.classList.remove('over'); });
  if (S.step === 1) handleFiles(e.dataTransfer.files);
});

/* ---------- arranque ---------- */
function boot() {
  if (!window.pdfjsLib || !window.PDFLib || !window.XLSX || !window.JSZip) {
    $('#app').innerHTML = '<main style="max-width:700px;margin:60px auto;padding:0 24px"><div class="err" role="alert"><p style="margin:0 0 6px;font-weight:700" class="bad-t">No se han podido cargar los componentes de la aplicación</p><p style="margin:0">Comprueba la conexión a internet y recarga la página.</p></div></main>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  render();
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { downloadsCap = d || null; }).catch(function () {}); } catch (e) {}
  window.__cotrali = { S: S, handleFiles: handleFiles, generate: generate };
}
window.addEventListener('load', boot);
})();
</script>
